name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    # Apple Silicon runner: the bundled Claude CLI is an arm64-only optional dependency.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Oniko-${{ github.sha }}-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
